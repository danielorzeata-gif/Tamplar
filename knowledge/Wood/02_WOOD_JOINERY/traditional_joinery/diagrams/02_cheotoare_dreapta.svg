<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 492" width="900" height="492" font-family="Arial, sans-serif"><rect width="900" height="492" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b03a2e"/></marker></defs><text x="14" y="26" font-size="17" font-weight="bold" fill="#2b2b2b">2. Cheotoare dreapta (interpretare din fotografii)</text><rect x="160" y="320" width="290" height="80" fill="#ead7b5" stroke="#2b2b2b"/><rect x="160" y="240" width="290" height="80" fill="#ead7b5" stroke="#2b2b2b"/><rect x="160" y="160" width="290" height="80" fill="#ead7b5" stroke="#2b2b2b"/><rect x="160" y="80" width="290" height="80" fill="#ead7b5" stroke="#2b2b2b"/><rect x="120" y="280.0" width="86" height="80" fill="#cfa877" stroke="#2b2b2b" stroke-width="1.6"/><rect x="120" y="200.0" width="86" height="80" fill="#cfa877" stroke="#2b2b2b" stroke-width="1.6"/><rect x="120" y="120.0" width="86" height="80" fill="#cfa877" stroke="#2b2b2b" stroke-width="1.6"/><rect x="120" y="40.0" width="86" height="80" fill="#cfa877" stroke="#2b2b2b" stroke-width="1.6"/><line x1="120" y1="422" x2="160" y2="422" stroke="#b03a2e" stroke-width="1.2" marker-start="url(#a)" marker-end="url(#a)"/><text x="140.0" y="440.0" font-size="13" fill="#b03a2e" text-anchor="middle" font-weight="bold">p</text><line x1="246" y1="320" x2="246" y2="280.0" stroke="#b03a2e" stroke-width="1.2" marker-start="url(#a)" marker-end="url(#a)"/><text x="272.0" y="305.0" font-size="13" fill="#b03a2e" text-anchor="middle" font-weight="bold">h/2</text><text x="470" y="70" font-size="13" fill="#444" text-anchor="start">Barne cioplite b x h (ex. 120-150 x 200-300 mm,</text><text x="470" y="88" font-size="13" fill="#444" text-anchor="start">Bartha 2019). Randurile peretilor alterneaza</text><text x="470" y="106" font-size="13" fill="#444" text-anchor="start">cu ~h/2; la colt capetele barnelor ies cu p</text><text x="470" y="124" font-size="13" fill="#444" text-anchor="start">peste fata peretelui, in 'dinti' alternanti (schematic).</text><text x="470" y="142" font-size="13" fill="#444" text-anchor="start"></text><text x="470" y="160" font-size="13" fill="#b03a2e" text-anchor="start">Observat in fotografiile ETNOMON (Maramures,</text><text x="470" y="178" font-size="13" fill="#b03a2e" text-anchor="start">Mures, Valcea): capete dreptunghiulare iesite,</text><text x="470" y="196" font-size="13" fill="#b03a2e" text-anchor="start">chiar si la peretii tencuiti.</text><text x="470" y="214" font-size="13" fill="#444" text-anchor="start"></text><text x="470" y="232" font-size="13" fill="#444" text-anchor="start">Forma interioara a crestaturii (adancime,</text><text x="470" y="250" font-size="13" fill="#444" text-anchor="start">pinten de blocare) NU se vede in fotografii si</text><text x="470" y="268" font-size="13" fill="#444" text-anchor="start">NU e descrisa in surse -> DE VERIFICAT pe teren.</text><text x="470" y="286" font-size="13" fill="#444" text-anchor="start"></text><text x="470" y="304" font-size="13" fill="#444" text-anchor="start">Fara pinten de blocare, imbinarea dreapta nu</text><text x="470" y="322" font-size="13" fill="#444" text-anchor="start">zavoraste barnele (USDA: square notch -> cuie de</text><text x="470" y="340" font-size="13" fill="#444" text-anchor="start">lemn necesare).</text><rect x="14" y="440" width="14" height="14" fill="#ead7b5" stroke="#2b2b2b"/><text x="34" y="452" font-size="12" fill="#2b2b2b" text-anchor="start">perete A (elevatie)</text><rect x="250" y="440" width="14" height="14" fill="#cfa877" stroke="#2b2b2b"/><text x="270" y="452" font-size="12" fill="#2b2b2b" text-anchor="start">capete de barna la colt (alternante)</text><text x="14" y="478" font-size="12" fill="#2b2b2b" text-anchor="start">RO: cheotori drepte (91 constructii ETNOMON)  |  echivalent probabil: square / lap notch cu capete iesite</text></svg>