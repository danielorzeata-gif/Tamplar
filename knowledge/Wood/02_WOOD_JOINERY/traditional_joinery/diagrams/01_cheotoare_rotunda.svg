<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 492" width="900" height="492" font-family="Arial, sans-serif"><rect width="900" height="492" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b03a2e"/></marker></defs><text x="14" y="26" font-size="17" font-weight="bold" fill="#2b2b2b">1. Cheotoare rotunda (saddle notch)</text><rect x="120" y="304" width="300" height="76" fill="#ead7b5" stroke="#2b2b2b"/><rect x="120" y="228" width="300" height="76" fill="#ead7b5" stroke="#2b2b2b"/><rect x="120" y="152" width="300" height="76" fill="#ead7b5" stroke="#2b2b2b"/><rect x="120" y="76" width="300" height="76" fill="#ead7b5" stroke="#2b2b2b"/><circle cx="120" cy="304" r="38.0" fill="#cfa877" stroke="#2b2b2b" stroke-width="1.6"/><circle cx="120" cy="304" r="8.444444444444445" fill="none" stroke="#2b2b2b" stroke-width="0.6"/><circle cx="120" cy="228" r="38.0" fill="#cfa877" stroke="#2b2b2b" stroke-width="1.6"/><circle cx="120" cy="228" r="8.444444444444445" fill="none" stroke="#2b2b2b" stroke-width="0.6"/><circle cx="120" cy="152" r="38.0" fill="#cfa877" stroke="#2b2b2b" stroke-width="1.6"/><circle cx="120" cy="152" r="8.444444444444445" fill="none" stroke="#2b2b2b" stroke-width="0.6"/><circle cx="120" cy="76" r="38.0" fill="#cfa877" stroke="#2b2b2b" stroke-width="1.6"/><circle cx="120" cy="76" r="8.444444444444445" fill="none" stroke="#2b2b2b" stroke-width="0.6"/><line x1="82.0" y1="402" x2="158.0" y2="402" stroke="#b03a2e" stroke-width="1.2" marker-start="url(#a)" marker-end="url(#a)"/><text x="120.0" y="420.0" font-size="13" fill="#b03a2e" text-anchor="middle" font-weight="bold">D</text><line x1="190" y1="304" x2="190" y2="266.0" stroke="#b03a2e" stroke-width="1.2" marker-start="url(#a)" marker-end="url(#a)"/><text x="214.0" y="290.0" font-size="13" fill="#b03a2e" text-anchor="middle" font-weight="bold">D/2</text><text x="470" y="70" font-size="13" fill="#444" text-anchor="start">Vedere pe fata peretelui A; barnele peretelui</text><text x="470" y="88" font-size="13" fill="#444" text-anchor="start">B apar in sectiune (cercuri) la colt.</text><text x="470" y="106" font-size="13" fill="#444" text-anchor="start">Randurile celor doi pereti sunt decalate cu D/2.</text><text x="470" y="124" font-size="13" fill="#444" text-anchor="start"></text><text x="470" y="142" font-size="13" fill="#b03a2e" text-anchor="start">Crestatura semicirculara se taie in barna de</text><text x="470" y="160" font-size="13" fill="#b03a2e" text-anchor="start">DEASUPRA, deschisa in jos -> nu retine apa.</text><text x="470" y="178" font-size="13" fill="#b03a2e" text-anchor="start">Crestatura taiata pe fata de sus (in 'cupa') si</text><text x="470" y="196" font-size="13" fill="#b03a2e" text-anchor="start">crestatura plata aduna apa (NPS Brief 26).</text><text x="470" y="214" font-size="13" fill="#444" text-anchor="start"></text><text x="470" y="232" font-size="13" fill="#444" text-anchor="start">Trasare: compasul de barne (scribe) deschis</text><text x="470" y="250" font-size="13" fill="#444" text-anchor="start">la 1/2 din diametrul barnei de jos (USDA 2015).</text><text x="470" y="268" font-size="13" fill="#444" text-anchor="start"></text><text x="470" y="286" font-size="13" fill="#444" text-anchor="start">Capetele barnelor ies peste colt (crown): ~0,5-1 D</text><text x="470" y="304" font-size="13" fill="#444" text-anchor="start">in fotografiile ETNOMON; e zona cea mai expusa</text><text x="470" y="322" font-size="13" fill="#444" text-anchor="start">la apa de pe acoperis (NPS).</text><rect x="14" y="440" width="14" height="14" fill="#ead7b5" stroke="#2b2b2b"/><text x="34" y="452" font-size="12" fill="#2b2b2b" text-anchor="start">perete A (elevatie)</text><rect x="250" y="440" width="14" height="14" fill="#cfa877" stroke="#2b2b2b"/><text x="270" y="452" font-size="12" fill="#2b2b2b" text-anchor="start">perete B (sectiune)</text><text x="14" y="478" font-size="12" fill="#2b2b2b" text-anchor="start">RO: cheotori rotunde / ciobanesti / 'stâneste'  |  EN: saddle notch with crown  |  barne rotunde, mai ales brad</text></svg>