<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 534" width="900" height="534" font-family="Arial, sans-serif"><rect width="900" height="534" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b03a2e"/></marker></defs><text x="14" y="26" font-size="17" font-weight="bold" fill="#2b2b2b">3. Coada de randunica completa (full dovetail)</text><rect x="120" y="60" width="300" height="400" fill="#ead7b5" stroke="#2b2b2b"/><line x1="290" y1="110.0" x2="420" y2="110.0" stroke="#2b2b2b"/><line x1="290" y1="210.0" x2="420" y2="210.0" stroke="#2b2b2b"/><line x1="290" y1="310.0" x2="420" y2="310.0" stroke="#2b2b2b"/><polygon points="120,60 290,84 290,136 120,160" fill="#cfa877" stroke="#2b2b2b" stroke-width="1.6"/><polygon points="120,160 290,184 290,236 120,260" fill="#cfa877" stroke="#2b2b2b" stroke-width="1.6"/><polygon points="120,260 290,284 290,336 120,360" fill="#cfa877" stroke="#2b2b2b" stroke-width="1.6"/><polygon points="120,360 290,384 290,436 120,460" fill="#cfa877" stroke="#2b2b2b" stroke-width="1.6"/><line x1="120" y1="48" x2="120" y2="472" stroke="#b03a2e" stroke-dasharray="6,4" stroke-width="1.4"/><text x="114" y="44" font-size="12" fill="#b03a2e" text-anchor="end">colt (fata peretelui B)</text><text x="470" y="70" font-size="13" fill="#444" text-anchor="start">Capetele peretelui B (in sectiune) sunt trapezoidale:</text><text x="470" y="88" font-size="13" fill="#444" text-anchor="start">ambele fete inclinate -> barna se blocheaza si</text><text x="470" y="106" font-size="13" fill="#444" text-anchor="start">nu poate iesi din colt pe orizontala.</text><text x="470" y="124" font-size="13" fill="#444" text-anchor="start"></text><text x="470" y="142" font-size="13" fill="#b03a2e" text-anchor="start">Colt DREPT, capetele taiate la fata peretelui -</text><text x="470" y="160" font-size="13" fill="#b03a2e" text-anchor="start">confirmat in fotografiile ETNOMON (Sibiu,</text><text x="470" y="178" font-size="13" fill="#b03a2e" text-anchor="start">Suceava, Buzau) si de USDA: la dovetail nu se</text><text x="470" y="196" font-size="13" fill="#b03a2e" text-anchor="start">lasa capete iesite.</text><text x="470" y="214" font-size="13" fill="#444" text-anchor="start"></text><text x="470" y="232" font-size="13" fill="#444" text-anchor="start">Fata de sus a 'cozii' inclinata in jos spre</text><text x="470" y="250" font-size="13" fill="#444" text-anchor="start">exterior -> apa iese din imbinare.</text><text x="470" y="268" font-size="13" fill="#444" text-anchor="start"></text><text x="470" y="286" font-size="13" fill="#444" text-anchor="start">Unghiul NU e dat in surse; panta 1:6-1:8 a lui</text><text x="470" y="304" font-size="13" fill="#444" text-anchor="start">Fairham e pentru mobilier, nu pentru barne.</text><text x="470" y="322" font-size="13" fill="#444" text-anchor="start"></text><text x="470" y="340" font-size="13" fill="#444" text-anchor="start">USDA: cea mai sigura imbinare de colt, dar cea</text><text x="470" y="358" font-size="13" fill="#444" text-anchor="start">mai lenta si pretentioasa.</text><rect x="14" y="482" width="14" height="14" fill="#ead7b5" stroke="#2b2b2b"/><text x="34" y="494" font-size="12" fill="#2b2b2b" text-anchor="start">perete A (elevatie)</text><rect x="250" y="482" width="14" height="14" fill="#cfa877" stroke="#2b2b2b"/><text x="270" y="494" font-size="12" fill="#2b2b2b" text-anchor="start">capete perete B (sectiune)</text><text x="14" y="520" font-size="12" fill="#2b2b2b" text-anchor="start">RO: cheotori in coada de randunica / 'nemtesti' / trapezoidale  |  EN: full dovetail notch  |  barne cioplite in 4 fete</text></svg>