<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 534" width="900" height="534" font-family="Arial, sans-serif"><rect width="900" height="534" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b03a2e"/></marker></defs><text x="14" y="26" font-size="17" font-weight="bold" fill="#2b2b2b">4. Coada de randunica pe jumatate (half dovetail)</text><rect x="120" y="60" width="300" height="400" fill="#ead7b5" stroke="#2b2b2b"/><line x1="290" y1="110.0" x2="420" y2="110.0" stroke="#2b2b2b"/><line x1="290" y1="210.0" x2="420" y2="210.0" stroke="#2b2b2b"/><line x1="290" y1="310.0" x2="420" y2="310.0" stroke="#2b2b2b"/><polygon points="120,60 290,84 290,160 120,160" fill="#cfa877" stroke="#2b2b2b" stroke-width="1.6"/><polygon points="120,160 290,184 290,260 120,260" fill="#cfa877" stroke="#2b2b2b" stroke-width="1.6"/><polygon points="120,260 290,284 290,360 120,360" fill="#cfa877" stroke="#2b2b2b" stroke-width="1.6"/><polygon points="120,360 290,384 290,460 120,460" fill="#cfa877" stroke="#2b2b2b" stroke-width="1.6"/><line x1="120" y1="48" x2="120" y2="472" stroke="#b03a2e" stroke-dasharray="6,4" stroke-width="1.4"/><text x="114" y="44" font-size="12" fill="#b03a2e" text-anchor="end">colt (fata peretelui B)</text><text x="470" y="70" font-size="13" fill="#444" text-anchor="start">Capetele peretelui B (in sectiune) au o singura</text><text x="470" y="88" font-size="13" fill="#444" text-anchor="start">fata inclinata; cealalta e orizontala.</text><text x="470" y="106" font-size="13" fill="#444" text-anchor="start"></text><text x="470" y="124" font-size="13" fill="#444" text-anchor="start">USDA: aproape la fel de sigura ca dovetail-ul</text><text x="470" y="142" font-size="13" fill="#444" text-anchor="start">complet, dar mai usor de executat -> mai</text><text x="470" y="160" font-size="13" fill="#444" text-anchor="start">frecventa in SUA.</text><text x="470" y="178" font-size="13" fill="#444" text-anchor="start"></text><text x="470" y="196" font-size="13" fill="#b03a2e" text-anchor="start">Nu are termen distinct in sursele romanesti;</text><text x="470" y="214" font-size="13" fill="#b03a2e" text-anchor="start">poate fi inclusa sub 'nemtesti/trapezoidale'.</text><rect x="14" y="482" width="14" height="14" fill="#ead7b5" stroke="#2b2b2b"/><text x="34" y="494" font-size="12" fill="#2b2b2b" text-anchor="start">perete A (elevatie)</text><rect x="250" y="482" width="14" height="14" fill="#cfa877" stroke="#2b2b2b"/><text x="270" y="494" font-size="12" fill="#2b2b2b" text-anchor="start">capete perete B (sectiune)</text><text x="14" y="520" font-size="12" fill="#2b2b2b" text-anchor="start">EN: half-dovetail notch  |  RO: fara termen distinct gasit</text></svg>