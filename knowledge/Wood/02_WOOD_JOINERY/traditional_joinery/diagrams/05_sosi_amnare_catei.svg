<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 502" width="940" height="502" font-family="Arial, sans-serif"><rect width="940" height="502" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b03a2e"/></marker></defs><text x="14" y="26" font-size="17" font-weight="bold" fill="#2b2b2b">5. Sistem cu stalpi santuiti (soşi / amnare / căţei)</text><text x="225.0" y="72" font-size="13" fill="#2b2b2b" text-anchor="middle" font-weight="bold">PLAN (de sus)</text><rect x="190" y="110" width="70" height="70" fill="#cfa877" stroke="#2b2b2b" stroke-width="1.6"/><rect x="190" y="134.0" width="18" height="22" fill="#fff" stroke="#2b2b2b"/><rect x="242" y="134.0" width="18" height="22" fill="#fff" stroke="#2b2b2b"/><rect x="40" y="122.0" width="150" height="46" fill="#ead7b5" stroke="#2b2b2b"/><rect x="189" y="136.0" width="18" height="18" fill="#ead7b5" stroke="#2b2b2b"/><rect x="260" y="122.0" width="150" height="46" fill="#ead7b5" stroke="#2b2b2b"/><rect x="243" y="136.0" width="18" height="18" fill="#ead7b5" stroke="#2b2b2b"/><text x="225.0" y="210" font-size="12" fill="#2b2b2b" text-anchor="middle">stalp (soş / amnar) cu sant vertical</text><text x="225.0" y="226" font-size="12" fill="#2b2b2b" text-anchor="middle">pe fiecare fata; capatul barnei e redus</text><text x="225.0" y="242" font-size="12" fill="#2b2b2b" text-anchor="middle">la o limba (cep) care intra in sant</text><text x="700" y="62" font-size="13" fill="#2b2b2b" text-anchor="middle" font-weight="bold">ELEVATIE</text><rect x="680" y="80" width="40" height="300" fill="#cfa877" stroke="#2b2b2b" stroke-width="1.6"/><rect x="510" y="90" width="170" height="38" fill="#ead7b5" stroke="#2b2b2b"/><rect x="720" y="90" width="170" height="38" fill="#ead7b5" stroke="#2b2b2b"/><rect x="510" y="130" width="170" height="38" fill="#ead7b5" stroke="#2b2b2b"/><rect x="720" y="130" width="170" height="38" fill="#ead7b5" stroke="#2b2b2b"/><rect x="510" y="170" width="170" height="38" fill="#ead7b5" stroke="#2b2b2b"/><rect x="720" y="170" width="170" height="38" fill="#ead7b5" stroke="#2b2b2b"/><rect x="510" y="210" width="170" height="38" fill="#ead7b5" stroke="#2b2b2b"/><rect x="720" y="210" width="170" height="38" fill="#ead7b5" stroke="#2b2b2b"/><rect x="510" y="250" width="170" height="38" fill="#ead7b5" stroke="#2b2b2b"/><rect x="720" y="250" width="170" height="38" fill="#ead7b5" stroke="#2b2b2b"/><rect x="510" y="290" width="170" height="38" fill="#ead7b5" stroke="#2b2b2b"/><rect x="720" y="290" width="170" height="38" fill="#ead7b5" stroke="#2b2b2b"/><rect x="510" y="330" width="170" height="38" fill="#ead7b5" stroke="#2b2b2b"/><rect x="720" y="330" width="170" height="38" fill="#ead7b5" stroke="#2b2b2b"/><rect x="490" y="380" width="420" height="26" fill="#cfa877" stroke="#2b2b2b"/><text x="700" y="424" font-size="12" fill="#2b2b2b" text-anchor="middle">talpa (de regula stejar: 45 din 60 de fise ETNOMON)</text><text x="14" y="330" font-size="12" fill="#444" text-anchor="start">Barnele scurte se lasa de sus in santurile</text><text x="14" y="347" font-size="12" fill="#444" text-anchor="start">stalpilor si se asaza pe talpa.</text><text x="14" y="364" font-size="12" fill="#b03a2e" text-anchor="start">Permite pereti lungi din barne scurte</text><text x="14" y="381" font-size="12" fill="#b03a2e" text-anchor="start">(util cand lemnul lung, mai ales de stejar,</text><text x="14" y="398" font-size="12" fill="#b03a2e" text-anchor="start">lipseste).</text><text x="14" y="470" font-size="12" fill="#2b2b2b" text-anchor="start">RO: soşi / şeşi (Transilvania centrala si de vest), amnare (Bucovina), căţei (Banat, Maramures); muc = cep in stalp</text><text x="14" y="488" font-size="12" fill="#2b2b2b" text-anchor="start">EN: post-and-log infill, 'pièce sur pièce' (USDA 2015, App. E; NPS Brief 26)  |  DE: Ständerbohlenbau</text></svg>