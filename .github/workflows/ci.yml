name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet test tests/RhinoWood.Tests/RhinoWood.Tests.csproj -c Release
      - run: dotnet build src/RhinoWood.Plugin/RhinoWood.Plugin.csproj -c Release
